name: AI chat service

on:
  push:
    branches:
      - 'master'
      - 'develop'
      - 'release/**'
      - 'hotfix/**'
    paths:
      - 'common/ASC.AI.Chat/**'
      - '.github/workflows/ai-chat.yml'
  pull_request:
    paths:
      - 'common/ASC.AI.Chat/**'
      - '.github/workflows/ai-chat.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: common/ASC.AI.Chat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: yarn install --immutable

      - name: Typecheck, lint, format and tests
        run: yarn check

      - name: The committed OpenAPI schemas are the ones the sources generate
        run: |
          yarn openapi
          if ! git diff --exit-code -- app/generated; then
            echo "::error::app/generated is stale. Run 'yarn openapi' in common/ASC.AI.Chat and commit the result."
            exit 1
          fi

# Vale settings for one rewritten operation description per .md file (check_texts.py writes them).
# check_texts.py reads this file, points StylesPath at the folder below and drops Microsoft when
# that package is not synced. To get it: vale --config .claude/skills/openapi-desc-opt/readability/vale/.vale.ini sync
StylesPath = styles
MinAlertLevel = suggestion
Packages = Microsoft

[*.md]
BasedOnStyles = Docs, Microsoft
# Docs.SentenceLength (20 words, references/description-rules.md section 4) replaces it.
Microsoft.SentenceLength = NO
# The rules do not ask to expand or avoid contractions.
Microsoft.Contractions = NO

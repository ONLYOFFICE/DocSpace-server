# OpenTelemetry wiring for the dev router. Mirrors
# buildtools/install/docker/config/nginx/router/otel.conf, but points at the
# Lua sources where the AppHost mounts them: buildtools/config/nginx is bind
# mounted to /etc/nginx/conf.d, so the lua tree lands in conf.d/lua.
#
# Both signals are wired up. The dependencies behind them (lua-resty-http,
# opentelemetry-lua and the lua-protobuf C module) are not part of OpenResty;
# the AppHost installs them at container start on the -fat image, which is why
# it switches to that flavour whenever telemetry is on.
#
# The exporters resolve the collector host with the Lua cosocket resolver, so an
# http-level `resolver` directive is required: it comes from the generated
# includes/onlyoffice-upstream-map.conf (resolver 127.0.0.11, Docker's embedded
# DNS, which also answers for host.docker.internal). Without it every flush
# fails with "no resolver defined" - and nginx's default error_log level hides
# that warning.
lua_package_path "/etc/nginx/conf.d/lua/?.lua;/usr/local/openresty/site/lualib/?.lua;/usr/local/openresty/site/lualib/?/init.lua;/usr/local/openresty/lualib/?.lua;/usr/local/openresty/lualib/?/init.lua;;";
# luarocks installs pb.so here, which is not on the default cpath
lua_package_cpath "/usr/local/openresty/luajit/lib/lua/5.1/?.so;/usr/local/openresty/site/lualib/?.so;/usr/local/openresty/lualib/?.so;;";

init_worker_by_lua_file /etc/nginx/conf.d/lua/otel/init.lua;
rewrite_by_lua_file /etc/nginx/conf.d/lua/otel/rewrite.lua;
log_by_lua_file /etc/nginx/conf.d/lua/otel/log.lua;

cacheFolder: ../../.yarn/cache

compressionLevel: mixed

enableGlobalCache: false

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.1.0.cjs

# The package is built once on an x64 runner but installed on both x64 and
# arm64 hosts (Bug 84155). tsx pulls esbuild, whose native binary is an
# optional platform-specific dependency, so fetch the Linux binaries for both
# CPUs; "current" keeps local development on any other OS working.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
    - arm64

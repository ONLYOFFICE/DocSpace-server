# Spectral ruleset for the DocSpace service documents.
#
# Scope: the five service documents under ASC.Api.Documentation/json/ - the OpenAPI
# documents emitted by the service builds. NOT the generator input (SDK/json/api-docs.json,
# deliberately distorted for openapi-generator) and NOT the published contract
# (sdk/docspace-api-spec/docspace-backend.yaml).
#
# Nothing runs this automatically. It is an inventory tool: a person runs it when the need
# arises and reads the report. It gates no build and blocks no pipeline.
#
# Cross-document invariants are NOT here and cannot be - Spectral lints one document at a
# time. OpenapiJoiner owns them and throws: duplicate path+method, empty or colliding
# operationId (case-insensitive, across services), lowercase tags, component name conflicts.
# Do not move those checks here; they would silently stop working.
#
# Prerequisite (same class of global tool as openapi-generator-cli, see scripts/installTools.bat):
#   npm i -g @stoplight/spectral-cli
#
# Run from common/Tools/ASC.Api.Documentation/ASC.Api.Documentation (one line, any shell):
#
#   spectral lint -r SDK/.spectral.yaml -f html --output.html lint/report.html -f markdown --output.markdown lint/errors.md json/api_2.0.json json/files_2.0.json json/people_2.0.json json/backup_2.0.json json/newai_2.0.json
#
# In PowerShell call `spectral.cmd`, not `spectral`: the machine execution policy is AllSigned,
# which blocks npm's unsigned spectral.ps1 shim. The .cmd shim is unaffected.
#
# Create lint/ first if missing; --output does not create directories. Exit code 1 means
# findings at severity error were present - that is the tool working, not failing.
#
# List the five documents explicitly. Do NOT use the glob json/*_2.0.json: it also matches
# json/ai_2.0.json, a dead file referenced by no config, csproj or script.
#
# Two outputs on purpose: report.html is the full inventory (every finding, thousands of
# rows); errors.md carries only severity=error - the markdown formatter drops warn and
# below - and is the artifact worth reading end to end or handing to someone else.
#
# Ratchet: rules start at the severity their debt justifies and are raised to `error` as the
# debt is paid. Do not add a rule at `error` while its violation count is above zero.

extends:
  - [spectral:oas, all]

rules:
  # `servers[0].variables.baseUrl.default` is empty at this stage by design - it is filled in
  # only for the published contract, by OpenApiServer.ApplyBaseUrlDefault. Fires once per
  # document, always falsely.
  oas3-server-variables: off

  # ---------------------------------------------------------------------------------------
  # Custom rules. spectral:oas has no rule for any of these.
  # Counts below were measured 2026-08-17 across all five service documents.
  # ---------------------------------------------------------------------------------------

  operation-summary:
    description: Every operation needs a summary.
    message: '{{path}} has no summary.'
    given: $.paths[*][get,put,post,delete,patch,options,head,trace]
    severity: error # measured: 0 violations in all five documents
    then:
      field: summary
      function: truthy

  path-segment-camel-case:
    description: >-
      Route segments are camelCase (.claude/rules/csharp-style.md) - never snake_case or
      kebab-case. Exempt: templated segments, the api/2.0 prefix, and the @-prefixed virtual
      folder segments that are part of the API surface (@my, @trash, @root, @favorites,
      @forms, @search, @self).
    message: 'Route segment is not camelCase: {{property}}'
    given: $.paths
    severity: warn # measured: 74 paths (72 kebab-case, 2 snake_case; 69 of them in newai)
    then:
      field: '@key'
      function: pattern
      functionOptions:
        match: '^(/(api|2\.0|\{[^}]+\}|@[a-z][a-zA-Z0-9]*|[a-z][a-zA-Z0-9]*))+/?$'

  schema-description:
    description: Every component schema needs a description.
    given: $.components.schemas[*]
    severity: warn # measured: 278 of 831
    then:
      field: description
      function: truthy

  schema-property-description:
    description: Every schema property needs a description.
    given: $.components.schemas[*].properties[*]
    severity: warn # measured: 403 of 3333
    then:
      field: description
      function: truthy

overrides:
  # newai_2.0.json is generated by `yarn openapi` from the ASC.NewAi Node service, not by
  # Swashbuckle from C# XML docs. It therefore carries the entire debt on descriptions and
  # route casing, and no compiler check can ever cover it - Spectral is the only tool that
  # can. Held at `warn` so that raising these rules to `error` for the four C# documents is
  # not blocked by one service.
  - files:
      - '**/newai_2.0.json'
    rules:
      operation-description: warn # measured: 103 of 103
      oas3-parameter-description: warn # measured: 41 of 41
      path-segment-camel-case: warn # measured: 69 of 74

  user.updated:
    post:
      operationId: userUpdated
      summary: user.updated
      description: |
        Sent on the `user.updated` event. The body is a UserDelivery, whose `payload` is a UserPayload. Roles that may subscribe to it: `DocSpaceAdmin`, `RoomAdmin`, `User`.

        Raised by these REST API operations:

        - `DELETE api/2.0/people/@self` (Close my own profile), rather than `user.deleted`: the profile is only disabled
        - `PUT api/2.0/people/activationstatus/{activationStatus}` (Set my activation status)
        - `PUT api/2.0/people/status/{status}` (Change a user status), for every listed account, whether or not its status changes
        - `POST api/2.0/people/type` (Start updating user type), once the queued type change finishes successfully, not when it is cancelled or fails
        - `PUT api/2.0/people/type/{type}` (Change a user type), for every converted user, one by one: a rejection in the middle leaves the webhooks of the users before it sent
        - `PUT api/2.0/people/{userId}` (Update a user), when the call changes the profile; on another member's profile only `disable` and `isUser` change anything
        - `PUT api/2.0/people/{userId}/culture` (Update a user culture), even when the culture does not change
        - `POST api/2.0/people/{userId}/photo` (Upload a user photo), only when `autosave` is true and the image is saved to the profile
        - `PUT api/2.0/people/{userId}/photo` (Update a user photo)
        - `DELETE api/2.0/people/{userId}/photo` (Delete a user photo), even when the profile had no avatar

        Not raised when the groups of a user are changed through the group API - `PUT api/2.0/group/{id}`, `POST`, `PUT` and `DELETE api/2.0/group/{id}/members`, `PUT api/2.0/group/{fromId}/members/{toId}` and `PUT api/2.0/group/{id}/manager`: those raise `group.updated` of each group concerned instead, and the `groups` of the user's payload are read again from the next `user.*` event. A change of the `department` list through `PUT api/2.0/people/{userId}` is the other way round: it arrives as `user.updated` of that user, and the groups it adds the user to or removes them from raise no `group.updated`; `department` given on creating a profile arrives within its `user.created` only.
      tags:
        - user
      parameters:
        - name: x-docspace-signature-256
          in: header
          required: true
          description: >-
            `sha256=` and the uppercase hex HMAC-SHA256 of the raw body under the subscription's secret.
            The only header that is authenticated; compare it case-insensitively.
          schema:
            type: string
        - name: x-docspace-event-id
          in: header
          required: true

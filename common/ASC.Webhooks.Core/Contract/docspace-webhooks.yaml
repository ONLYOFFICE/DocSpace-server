  group.created:
    post:
      operationId: groupCreated
      summary: group.created
      description: |
        Sent on the `group.created` event. The body is a GroupDelivery, whose `payload` is a GroupPayload. Roles that may subscribe to it: `DocSpaceAdmin`, `RoomAdmin`.

        Raised by these REST API operations:

        - `POST api/2.0/group` (Add a new group), once for the new group. The `user.*` payloads of its manager and members are not re-sent
      tags:
        - group
      parameters:
        - name: x-docspace-signature-256
          in: header
          required: true
          description: >-
            `sha256=` and the uppercase hex HMAC-SHA256 of the raw body under the subscription's secret.
            The only header that is authenticated; compare it case-insensitively.

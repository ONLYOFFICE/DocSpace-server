        - name: x-docspace-event-timestamp
          in: header
          required: true
          description: A copy of `event.createOn`, in the same ISO-8601 UTC spelling. Not covered by the
            signature.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileDelivery'
      responses:
        2XX:
          description: Acknowledges the delivery. The answer's body is kept in the delivery log, not interpreted.
        '410':
          description: Deletes the subscription at once; nothing is retried or sent to it any more.
        default:
          description: >-
            Any other status, a redirect, a timeout or a network error fails the attempt, which is retried
            on the schedule the description of this document gives.
  file.uploaded:
    post:
      operationId: fileUploaded
      summary: file.uploaded
      description: |
        Sent on the `file.uploaded` event. The body is a FileDelivery, whose `payload` is a FilePayload. Roles that may subscribe to it: `DocSpaceAdmin`, `RoomAdmin`, `User`.

        Raised by these REST API operations:

        - `POST api/2.0/files/@my/insert` (Insert a file into My documents), whether the upload creates a new file or is saved as a new version of an existing file
        - `POST api/2.0/files/@my/upload` (Upload a file to My documents), whether the upload creates a new file or is saved as a new version of an existing file
        - `POST api/2.0/files/file/{fileId}/copyas` (Copy a file), as well when the copy is converted to another format
        - `POST api/2.0/files/{folderId}/insert` (Insert a file), whether the upload creates a new file or is saved as a new version of an existing file
        - `POST api/2.0/files/{folderId}/session/{sessionId}` (Upload the next chunk), on the request that completes the upload, without `file.created`
        - `PUT api/2.0/files/{folderId}/session/{sessionId}/finalize` (Finalize an upload session), without `file.created`
        - `POST api/2.0/files/{folderId}/upload` (Upload a file), whether the upload creates a new file or is saved as a new version of an existing file

        Also raised by an upload of the parts to the `location` link that creating an upload session returns, once the last part arrives or that link finalizes the session.
      tags:
        - file
      parameters:
        - name: x-docspace-signature-256
          in: header
          required: true
          description: >-
            `sha256=` and the uppercase hex HMAC-SHA256 of the raw body under the subscription's secret.
            The only header that is authenticated; compare it case-insensitively.
          schema:
            type: string
        - name: x-docspace-event-id
          in: header
          required: true
          description: >-
            A copy of `event.id`, for dropping an already-seen delivery without parsing the body. Not
            covered by the signature.
          schema:
            type: string
        - name: x-docspace-event-timestamp
          in: header
          required: true
          description: A copy of `event.createOn`, in the same ISO-8601 UTC spelling. Not covered by the
            signature.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileDelivery'
      responses:
        2XX:
          description: Acknowledges the delivery. The answer's body is kept in the delivery log, not interpreted.
        '410':
          description: Deletes the subscription at once; nothing is retried or sent to it any more.
        default:
          description: >-
            Any other status, a redirect, a timeout or a network error fails the attempt, which is retried
            on the schedule the description of this document gives.
  file.updated:
    post:
      operationId: fileUpdated
      summary: file.updated

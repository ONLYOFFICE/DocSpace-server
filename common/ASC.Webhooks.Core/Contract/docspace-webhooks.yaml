  file.created:
    post:
      operationId: fileCreated
      summary: file.created
      description: |
        Sent on the `file.created` event. The body is a FileDelivery, whose `payload` is a FilePayload. Roles that may subscribe to it: `DocSpaceAdmin`, `RoomAdmin`, `User`.

        Raised by these REST API operations:

        - `POST api/2.0/docs/builder` (Run a document builder script), for each file the queued script saves: `file.created` for a new file, `file.updated` for an existing one
        - `POST api/2.0/docs/converter` (Convert a file)
        - `POST api/2.0/files/@my/file` (Create a file in My documents)
        - `POST api/2.0/files/@my/html` (Create an HTML file in My documents), whether the content creates a new file or is saved as a new version of an existing file
        - `POST api/2.0/files/@my/insert` (Insert a file into My documents), whether the upload creates a new file or is saved as a new version of an existing file
        - `POST api/2.0/files/@my/text` (Create a text file in My documents), whether the content creates a new file or is saved as a new version of an existing file
        - `POST api/2.0/files/@my/upload` (Upload a file to My documents), whether the upload creates a new file or is saved as a new version of an existing file
        - `POST api/2.0/files/file/{fileId}/copyas` (Copy a file)
        - `POST api/2.0/files/file/{id}/saveaspdf` (Save a file as PDF)
        - `POST api/2.0/files/{folderId}/file` (Create a file)
        - `POST api/2.0/files/{folderId}/html` (Create an HTML file), whether the content creates a new file or is saved as a new version of an existing file
        - `POST api/2.0/files/{folderId}/insert` (Insert a file), whether the upload creates a new file or is saved as a new version of an existing file
        - `POST api/2.0/files/{folderId}/text` (Create a text file), whether the content creates a new file or is saved as a new version of an existing file
        - `POST api/2.0/files/{folderId}/upload` (Upload a file), whether the upload creates a new file or is saved as a new version of an existing file
        - `POST apisystem/portal/licensequota/report` (Generate the Document Server license quota report), for the report file it saves into the caller's personal section, unless there is no license quota data to report

        Also raised by an AI agent during a chat, for every document, presentation or form it creates with its editor tools.
      tags:
        - file
      parameters:
        - name: x-docspace-signature-256
          in: header
          required: true
          description: >-
            `sha256=` and the uppercase hex HMAC-SHA256 of the raw body under the subscription's secret.
            The only header that is authenticated; compare it case-insensitively.

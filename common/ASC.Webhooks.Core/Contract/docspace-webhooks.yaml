webhooks:
  user.created:
    post:
      operationId: userCreated
      summary: user.created
      description: |
        Sent on the `user.created` event. The body is a UserDelivery, whose `payload` is a UserPayload. Roles that may subscribe to it: `DocSpaceAdmin`, `RoomAdmin`.

        Raised by these REST API operations:

        - `POST api/2.0/people` (Add a user), once the avatar named in `files`, if any, is saved: when that download fails, the profile exists but the webhook is not sent
        - `POST api/2.0/people/thirdparty/signup` (Sign up with a provider), when the third-party account is not linked to a profile yet and a new profile is created
      tags:
        - user
      parameters:
        - name: x-docspace-signature-256
          in: header
          required: true
          description: >-
            `sha256=` and the uppercase hex HMAC-SHA256 of the raw body under the subscription's secret.
            The only header that is authenticated; compare it case-insensitively.
          schema:
            type: string
        - name: x-docspace-event-id
          in: header
          required: true
          description: >-
            A copy of `event.id`, for dropping an already-seen delivery without parsing the body. Not
            covered by the signature.
          schema:
            type: string
        - name: x-docspace-event-timestamp
          in: header
          required: true
          description: A copy of `event.createOn`, in the same ISO-8601 UTC spelling. Not covered by the
            signature.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDelivery'
      responses:
        2XX:
          description: Acknowledges the delivery. The answer's body is kept in the delivery log, not interpreted.
        '410':
          description: Deletes the subscription at once; nothing is retried or sent to it any more.
        default:
          description: >-
            Any other status, a redirect, a timeout or a network error fails the attempt, which is retried
            on the schedule the description of this document gives.

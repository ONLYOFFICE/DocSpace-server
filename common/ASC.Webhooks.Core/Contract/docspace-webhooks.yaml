        Raised by these REST API operations:

        - `PUT api/2.0/group/{fromId}/members/{toId}` (Move group members), twice, once for the source and once for the destination group, and not at all when both IDs name the same group
        - `PUT api/2.0/group/{id}` (Update a group)
        - `PUT api/2.0/group/{id}/manager` (Set a group manager)
        - `POST api/2.0/group/{id}/members` (Replace group members)
        - `PUT api/2.0/group/{id}/members` (Add group members)
        - `DELETE api/2.0/group/{id}/members` (Remove group members)
      tags:

        - `POST api/2.0/people/reassign/start` (Start the data reassignment), for the source account when `deleteProfile` is true, once the reassignment finishes successfully
        - `DELETE api/2.0/people/{userId}` (Delete a user)
      tags:
        - user
      parameters:
        - name: x-docspace-signature-256
          in: header
          required: true
          description: >-

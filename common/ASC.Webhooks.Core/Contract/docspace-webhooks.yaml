        - name: x-docspace-event-timestamp
          in: header
          required: true
          description: A copy of `event.createOn`, in the same ISO-8601 UTC spelling. Not covered by the
            signature.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDelivery'
      responses:
        2XX:
          description: Acknowledges the delivery. The answer's body is kept in the delivery log, not interpreted.
        '410':
          description: Deletes the subscription at once; nothing is retried or sent to it any more.
        default:
          description: >-
            Any other status, a redirect, a timeout or a network error fails the attempt, which is retried
            on the schedule the description of this document gives.

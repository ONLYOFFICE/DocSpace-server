openapi: 3.1.0
info:
  title: ONLYOFFICE DocSpace Webhooks
  version: 1.0.0
  description: |
    Wire contract for OUTBOUND DocSpace webhook deliveries.

    This document is NOT the REST API spec and shares no schemas with it. Webhook
    payloads are DTOs owned by the webhook contract (UserWebhookDto, GroupWebhookDto,
    FileWebhookDto, FolderWebhookDto, RoomWebhookDto, FormSubmitWebhookDto).

    Each trigger declares its payload with [WebhookPayload] on the WebhookTrigger
    field, and each DTO declares the same WebhookPayloadKind; the map below is that
    pairing. See ASC.Webhooks.Core/WebhookPayloadKind.cs for why it is spelled twice.

    SERIALIZATION RULES (ASC.Webhooks.Core/WebhookPublisher.cs)
      1. PropertyNamingPolicy = CamelCase.
      2. DefaultIgnoreCondition = WhenWritingDefault. Every null, false, 0 and
         default-valued property is OMITTED. Consequently almost nothing here is
         `required`, and absence never means "unset" -- it means "default".
      3. [JsonIgnore] on the domain type is honoured.
      4. Computed read-only getters ARE serialized. IgnoreReadOnlyProperties is
         set only on the sender's options, by which point `payload` is an opaque
         JsonElement, so it never applies to payload bodies.
      5. DateTime is emitted as UTC ISO-8601. Envelope timestamps are truncated
         to whole seconds (WebhookPayload.GetShortUtcNow).
      6. Entry ids are generic T: int for internal storage, string for
         third-party providers. Modelled here as oneOf[integer, string].

    TRANSPORT
      POST, Content-Type: application/json; charset=utf-8
      Redirects are not followed. Retry budget is ~31s (5 attempts, exponential
      from 1s), so receivers must acknowledge fast and process out of band.

      Headers:
        x-docspace-signature-256  sha256=<UPPERCASE hex HMAC-SHA256 of the raw
                                  body>. GitHub emits lowercase hex, so compare
                                  case-insensitively. This is the only header
                                  that is authenticated.
        x-docspace-event-id       Copy of event.id.
        x-docspace-event-timestamp
                                  Copy of event.createOn, same ISO-8601 UTC
                                  spelling, e.g. 2026-09-17T10:22:56Z.

      The last two exist so a receiver can drop a stale or already-seen delivery
      without parsing the body. They are NOT covered by the signature, which is
      computed over the body alone, so anything in transit can rewrite them.

      Reject on them freely -- dropping a delivery is fail-safe, and whoever can
      rewrite a header could drop the request instead. Never ACCEPT on them: a
      replayed delivery with its timestamp header rewritten to "now" still
      carries a valid signature, so a receiver that checks freshness only
      against the header has no replay protection at all. After verifying,
      re-check event.createOn and event.id from the parsed body; they are the
      authoritative values, and comparing them against the headers also detects
      tampering for free.

paths: {}

x-docspace-trigger-payloads:
  description: >
    Machine-readable trigger -> payload schema map. Source of truth for the SDK
    dispatch layer. Mirrors the [WebhookPayload] attributes on WebhookTrigger and
    on the payload DTOs; WebhookPayloadPairingTests keeps those two in step.
  map:
    user.created: UserPayload
    user.invited: UserPayload
    user.updated: UserPayload
    user.deleted: UserPayload
    group.created: GroupPayload
    group.updated: GroupPayload
    group.deleted: GroupPayload
    file.created: FilePayload
    file.uploaded: FilePayload
    file.updated: FilePayload
    file.trashed: FilePayload
    file.deleted: FilePayload
    file.restored: FilePayload
    file.copied: FilePayload
    file.moved: FilePayload
    file.downloaded: FilePayload
    folder.created: FolderPayload
    folder.updated: FolderPayload
    folder.trashed: FolderPayload
    folder.deleted: FolderPayload
    folder.restored: FolderPayload
    folder.copied: FolderPayload
    folder.moved: FolderPayload
    folder.downloaded: FolderPayload
    room.created: RoomPayload
    room.updated: RoomPayload
    room.archived: RoomPayload
    room.deleted: RoomPayload
    room.restored: RoomPayload
    room.copied: RoomPayload
    agent.created: RoomPayload
    agent.updated: RoomPayload
    agent.deleted: RoomPayload
    form.submit: FormSubmitPayload
    form.filled.out: FilePayload
    form.stopped: FilePayload
    "*": null

components:
  schemas:

    # ---------------------------------------------------------------- envelope

    WebhookEnvelope:
      type: object
      description: >
        The body of every delivery. `payload` is narrowed by `event.trigger`
        per x-docspace-trigger-payloads.
      properties:
        event:
          $ref: "#/components/schemas/WebhookEventInfo"
        payload:
          description: >
            Trigger-specific body. Left untyped so that codegen stays clean in
            all 9 target languages; the runtime narrows it.
        webhook:
          $ref: "#/components/schemas/WebhookConfigInfo"

    WebhookEventInfo:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: >
            Delivery-log record id, and the idempotency key. Stable across every
            resend of one delivery -- the server's automatic retries and a manual
            retry from the admin UI alike, since a manual retry requeues the same
            record rather than minting a new one. The same id therefore means the
            same logical event, always. It is also echoed in x-docspace-event-id.

            The delivery log keeps only the latest attempt of a record, so a manual
            retry overwrites the outcome of the previous one.
        createOn:
          type: string
          format: date-time
          description: >
            UTC, whole seconds. No header timestamp exists, so replay defence
            must read this from the verified body.
        createBy:
          type: string
          format: uuid
          description: Acting user. Omitted when the empty guid (background jobs).
        trigger:
          type: string
          description: e.g. "file.created". "*" only in the legacy-payload fallback.
        triggerId:
          type: integer
          format: int64
          description: Bit value of the trigger. Omitted when 0 (the "*" fallback).

    EntryId:
      description: >
        Entry identifier. Generic T in the domain types: integer for entries in
        DocSpace's own storage, string for entries backed by a third-party
        provider. Both occur on the same portal.
      oneOf:
        - type: integer
        - type: string

    WebhookTargetInfo:
      type: object
      description: Present only when the subscription is scoped to one entity.
      properties:
        id:
          $ref: "#/components/schemas/EntryId"
        type:
          type: string
          enum: [user, group, file, folder, room, form, agent]

    WebhookConfigInfo:
      type: object
      description: The subscription, plus its delivery state at send time.
      properties:
        id:
          type: integer
        name:
          type: string
        url:
          type: string
        triggers:
          type: array
          items:
            type: string
          description: Subscribed events, or ["*"] for the catch-all.
        target:
          $ref: "#/components/schemas/WebhookTargetInfo"
        lastFailureOn:
          type: string
          format: date-time
        lastFailureContent:
          type: string
        lastSuccessOn:
          type: string
          format: date-time
        retryCount:
          type: integer
          description: Omitted on the first attempt (0). Present from attempt 2.
        retryOn:
          type: string
          format: date-time

    # ---------------------------------------------------------------- payloads
    UserPayload:
      type: object
      description: |
        ASC.Api.Core/Webhook/Payloads/UserWebhookDto.cs. A copy of the REST
        EmployeeFullDto, owned by the webhook contract and free to diverge from it.

        Not carried, deliberately: sid / ssoNameId / ssoSessionId (LDAP and SAML
        identifiers, and a SAML SESSION id, all of which the domain entity used to
        put on the wire), loginEventId, authCookieLifetime, tfaAppEnabled, theme,
        isAnonim, and `shared`. `contacts` appears once, as a typed list, rather
        than twice in two shapes.
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        userName:
          type: string
        email:
          type: string
          format: email
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/ContactPayload"
        status:
          type: integer
          description: enum EmployeeStatus
        activationStatus:
          type: integer
          description: enum EmployeeActivationStatus (flags), AutoGenerated masked off
        terminated:
          type: string
          format: date-time
        department:
          type: string
          description: Comma-separated group names, HTML-encoded.
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupSummaryPayload"
        location:
          type: string
        notes:
          type: string
        isAdmin:
          type: boolean
        isRoomAdmin:
          type: boolean
        isOwner:
          type: boolean
        isVisitor:
          type: boolean
        isCollaborator:
          type: boolean
        isLDAP:
          type: boolean
        isSSO:
          type: boolean
        listAdminModules:
          type: array
          items:
            type: string
        cultureName:
          type: string
        mobilePhone:
          type: string
        mobilePhoneActivationStatus:
          type: integer
          description: enum MobilePhoneActivationStatus
        quotaLimit:
          type: integer
          format: int64
        usedSpace:
          type: number
        isCustomQuota:
          type: boolean
        createdBy:
          $ref: "#/components/schemas/UserSummaryPayload"
        registrationDate:
          type: string
          format: date-time
        hasAvatar:
          type: boolean
        avatar:
          type: string
        avatarOriginal:
          type: string
        avatarMax:
          type: string
        avatarMedium:
          type: string
        avatarSmall:
          type: string
        profileUrl:
          type: string

    UserSummaryPayload:
      type: object
      description: A user referenced from another payload.
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        userName:
          type: string
        email:
          type: string
          format: email
        avatar:
          type: string
        profileUrl:
          type: string

    ContactPayload:
      type: object
      properties:
        type:
          type: string
        value:
          type: string

    GroupPayload:
      type: object
      description: |
        ASC.Api.Core/Webhook/Payloads/GroupWebhookDto.cs. A copy of the REST
        GroupDto.

        The member list is not carried - a group can hold thousands of users and
        each would be expanded into every group event. `membersCount` is the hint
        that the roster changed; read it from GET api/2.0/group/{id}.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parent:
          type: string
          format: uuid
        category:
          type: string
          format: uuid
        isLDAP:
          type: boolean
        isSystem:
          type: boolean
        manager:
          $ref: "#/components/schemas/UserSummaryPayload"
        membersCount:
          type: integer

    GroupSummaryPayload:
      type: object
      description: A group referenced from another payload.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        manager:
          type: string
          description: The user name of the group manager, not an id.
        isSystem:
          type: boolean

    FileEntryPayload:
      type: object
      description: |
        ASC.Files/Core/ApiModels/WebhookDto/FileEntryWebhookDto.cs. What
        FilePayload, FolderPayload and RoomPayload have in common.

        This schema is never sent on its own -- unlike the previous contract,
        where every file, folder, room, agent and form trigger sent exactly this
        and nothing else. The old payload was typed as the abstract FileEntry<T>
        at the publish site, so System.Text.Json serialized by DECLARED type and
        every File<T> and Folder<T> member was silently dropped: version,
        contentLength, fileType, folderType, filesCount, roomType never reached a
        receiver. That is fixed; the subtypes below carry their own fields.

        Not carried, deliberately: access, security, securityByUsers,
        availableShareRights, shareSettings, canShare, shared, sharedForUser,
        sharedExternal, parentShared, isFavorite, requestToken, external,
        shareRecord. Those answer "what may the caller see", and a delivery has no
        caller - who receives it is decided by WebhookFileEntryAccessChecker
        against the subscription owner. Putting one user's permission matrix on
        the wire was both meaningless to the receiver and a disclosure.
      properties:
        id:
          $ref: "#/components/schemas/EntryId"
        parentId:
          $ref: "#/components/schemas/EntryId"
        rootFolderId:
          $ref: "#/components/schemas/EntryId"
        title:
          type: string
        fileEntryType:
          type: integer
          description: 1 folder, 2 file. Present on every entry payload.
        created:
          type: string
          format: date-time
        createdBy:
          $ref: "#/components/schemas/UserSummaryPayload"
        updated:
          type: string
          format: date-time
        updatedBy:
          $ref: "#/components/schemas/UserSummaryPayload"
        rootFolderType:
          type: integer
          description: enum FolderType
        parentRoomType:
          type: integer
          description: enum FolderType
        originId:
          $ref: "#/components/schemas/EntryId"
        originRoomId:
          $ref: "#/components/schemas/EntryId"
        originTitle:
          type: string
        originRoomTitle:
          type: string
        providerItem:
          type: boolean
        providerKey:
          type: string
        providerId:
          type: integer
        order:
          type: integer
          description: Position within an indexed room.

    FilePayload:
      description: |
        ASC.Files/Core/ApiModels/WebhookDto/FileWebhookDto.cs. A copy of the REST
        FileDto. Sent by every file.* trigger and by form.filled.out and
        form.stopped.

        Not carried: thumbnailUrl, dimensions, viewAccessibility, formFillingStatus,
        hasDraft and the form-role fields. Each needs per-request work the REST
        helper does and a delivery must not - dimensions in particular opens the
        file stream to measure the image.
      allOf:
        - $ref: "#/components/schemas/FileEntryPayload"
        - type: object
          properties:
            version:
              type: integer
            versionGroup:
              type: integer
            contentLength:
              type: integer
              format: int64
              description: Bytes, as a number. The REST DTO sends a formatted string.
            fileType:
              type: integer
              description: enum FileType
            fileExst:
              type: string
              description: Includes the leading dot, e.g. ".docx".
            comment:
              type: string
            viewUrl:
              type: string
              description: Download URL. Carries no share token.
            webUrl:
              type: string
              description: Browser URL. Carries no share token.
            encrypted:
              type: boolean
            locked:
              type: boolean
            lockedBy:
              type: string
            isForm:
              type: boolean
            customFilterEnabled:
              type: boolean
            customFilterEnabledBy:
              type: string
            lastOpened:
              type: string
              format: date-time
            vectorizationStatus:
              type: integer
              description: enum VectorizationStatus

    FolderPayload:
      description: |
        ASC.Files/Core/ApiModels/WebhookDto/FolderWebhookDto.cs. The folder.*
        triggers. Rooms are RoomPayload, never this, even though both come from
        Folder<T>.

        Not carried: inRoom, mute, new - all per-viewer state.
      allOf:
        - $ref: "#/components/schemas/FileEntryPayload"
        - type: object
          properties:
            filesCount:
              type: integer
            foldersCount:
              type: integer
            type:
              type: integer
              description: enum FolderType
            isShareable:
              type: boolean

    RoomPayload:
      description: |
        ASC.Files/Core/ApiModels/WebhookDto/RoomWebhookDto.cs. The room.* triggers
        and every agent.* trigger - an agent is an AI room and has the same shape
        today.

        Not carried: logo, watermark, lifetime, tags, chatSettings. Each needs
        per-request URL building or an extra query; read them from
        GET api/2.0/files/rooms/{id}.
      allOf:
        - $ref: "#/components/schemas/FileEntryPayload"
        - type: object
          properties:
            roomType:
              type: integer
              description: enum RoomType
            type:
              type: integer
              description: enum FolderType
            filesCount:
              type: integer
            foldersCount:
              type: integer
            private:
              type: boolean
            indexing:
              type: boolean
            denyDownload:
              type: boolean
            pinned:
              type: boolean
            quotaLimit:
              type: integer
              format: int64
            usedSpace:
              type: integer
              format: int64
            color:
              type: string
            cover:
              type: string

    FormSubmitPayload:
      type: object
      description: |
        ASC.Files/Core/ApiModels/WebhookDto/FormSubmitWebhookDto.cs. The ONLY
        trigger with a wrapper rather than a bare entry, and the only one whose
        `webhook.target.id` refers to a different entity (the original form) than
        the entry that changed. form.filled.out and form.stopped do NOT use this
        shape -- they send FilePayload.
      properties:
        originalForm:
          $ref: "#/components/schemas/FilePayload"
        submittedForm:
          $ref: "#/components/schemas/FilePayload"

# Generated by common/Tools/ASC.Webhooks.Contract from the webhook payload DTOs, WebhookTrigger and
# docspace-webhooks.header.yaml. Do not edit: change those and run
# dotnet run --project common/Tools/ASC.Webhooks.Contract

openapi: 3.1.0
info:
  title: ONLYOFFICE DocSpace Webhooks
  version: 1.0.0
  description: |
    Wire contract for OUTBOUND DocSpace webhook deliveries.

    This document is NOT the REST API spec and shares no schemas with it. Webhook
    payloads are DTOs owned by the webhook contract (UserWebhookDto, GroupWebhookDto,
    FileWebhookDto, FolderWebhookDto, RoomWebhookDto, FormSubmitWebhookDto).

    Which trigger sends which payload is the map below, x-docspace-trigger-payloads.

    SERIALIZATION RULES (ASC.Webhooks.Core/WebhookPublisher.cs)
      1. PropertyNamingPolicy = CamelCase.
      2. DefaultIgnoreCondition = WhenWritingDefault. Every null, false, 0 and
         default-valued property is OMITTED. Consequently almost nothing here is
         `required`, and absence never means "unset" -- it means "default".
      3. [JsonIgnore] on the domain type is honoured.
      4. Computed read-only getters ARE serialized. IgnoreReadOnlyProperties is
         set only on the sender's options, by which point `payload` is an opaque
         JsonElement, so it never applies to payload bodies.
      5. DateTime is emitted as UTC ISO-8601. Envelope timestamps are truncated
         to whole seconds (WebhookPayload.GetShortUtcNow).
      6. Entry ids are generic T: int for internal storage, string for
         third-party providers. Modelled here as oneOf[integer, string].

    TRANSPORT
      POST, Content-Type: application/json; charset=utf-8
      Redirects are not followed. Each request waits 30s for a response, so
      receivers must acknowledge fast and process out of band. Any non-2xx
      answer, timeout or network error is a failed attempt; a failed delivery
      is retried after 1m, 5m, 30m, 2h, 5h and 10h (each +-10% jitter), i.e.
      7 attempts over ~18h by default (WebHooks/Settings.cs, configurable per
      installation as webhooks:retryIntervals), and then abandoned. A portal
      admin or the subscription's creator can retry it manually from the
      delivery log, which starts a fresh series under the same event.id.

      Headers:
        x-docspace-signature-256  sha256=<UPPERCASE hex HMAC-SHA256 of the raw
                                  body>. GitHub emits lowercase hex, so compare
                                  case-insensitively. This is the only header
                                  that is authenticated.
        x-docspace-event-id       Copy of event.id.
        x-docspace-event-timestamp
                                  Copy of event.createOn, same ISO-8601 UTC
                                  spelling, e.g. 2026-09-17T10:22:56Z.

      The last two exist so a receiver can drop an already-seen delivery
      without parsing the body. They are NOT covered by the signature, which is
      computed over the body alone, so anything in transit can rewrite them.
      Reject on them freely -- dropping a delivery is fail-safe, and whoever can
      rewrite a header could drop the request instead -- but never ACCEPT on
      them: after verifying, read event.id from the parsed body, it is the
      authoritative value.

      The signature covers the body only; it does not prove when the request was
      sent. event.createOn is the moment of the event, not of the request: it
      stays the same through the automatic retries (about 18 hours on the
      default schedule) and through a manual retry at any later time, so a
      freshness window on it, or on the timestamp header, rejects legitimate
      retries. Deduplicate on event.id instead: keep the ids already processed
      and drop a delivery whose id is among them. That is the replay defence.
paths: {}
x-docspace-trigger-payloads:
  description: >
    Machine-readable trigger -> payload schema map. Source of truth for the SDK dispatch layer. Generated
    from the trigger table in common/Tools/ASC.Webhooks.Contract.
  map:
    user.created: UserPayload
    user.invited: UserPayload
    user.updated: UserPayload
    user.deleted: UserPayload
    group.created: GroupPayload
    group.updated: GroupPayload
    group.deleted: GroupPayload
    file.created: FilePayload
    file.uploaded: FilePayload
    file.updated: FilePayload
    file.trashed: FilePayload
    file.deleted: FilePayload
    file.restored: FilePayload
    file.copied: FilePayload
    file.moved: FilePayload
    file.downloaded: FilePayload
    folder.created: FolderPayload
    folder.updated: FolderPayload
    folder.trashed: FolderPayload
    folder.deleted: FolderPayload
    folder.restored: FolderPayload
    folder.copied: FolderPayload
    folder.moved: FolderPayload
    folder.downloaded: FolderPayload
    room.created: RoomPayload
    room.updated: RoomPayload
    room.archived: RoomPayload
    room.deleted: RoomPayload
    room.restored: RoomPayload
    room.copied: RoomPayload
    form.submit: FormSubmitPayload
    form.filled.out: FilePayload
    form.stopped: FilePayload
    agent.created: RoomPayload
    agent.updated: RoomPayload
    agent.deleted: RoomPayload
    '*': null
components:
  schemas:
    EntryId:
      description: >
        Entry identifier. Generic T in the domain types: integer for entries in DocSpace's own storage,
        string for entries backed by a third-party provider. Both occur on the same portal.
      oneOf:
        - type: integer
        - type: string
    WebhookEnvelope:
      type: object
      description: >-
        The body of every delivery. `payload` is narrowed by `event.trigger` per x-docspace-trigger-payloads.
      properties:
        event:
          $ref: '#/components/schemas/WebhookEventInfo'
        payload:
          description: >-
            The trigger-specific body. Left untyped so that codegen stays clean in all 9 target languages;
            the runtime narrows it.
        webhook:
          $ref: '#/components/schemas/WebhookConfigInfo'
    WebhookEventInfo:
      type: object
      description: The event a delivery reports.
      properties:
        id:
          type: integer
          format: int32
          description: >-
            The ID of the first delivery-log record of the event, and the idempotency key. It is stable
            across every resend of one event, the server's automatic retries and a manual retry from the
            admin UI alike: a manual retry is a delivery-log record of its own, but it still sends the
            ID of the first one. The same ID therefore always means the same logical event. It is also
            echoed in the x-docspace-event-id header.
        createOn:
          type: string
          format: date-time
          description: >-
            When the event happened, in UTC and whole seconds. It stays the same on every retry, automatic
            or manual, so it says nothing about when the request was sent: a freshness check on it would
            reject legitimate retries, and the replay defence is deduplication on `id`. Echoed in the
            unsigned x-docspace-event-timestamp header.
        createBy:
          type: string
          format: uuid
          description: >-
            The ID of the user whose action caused the event. Omitted when it is the empty GUID, as for
            background jobs.
        trigger:
          type: string
          description: The trigger name, e.g. "file.created". "*" only in the legacy-payload fallback.
        triggerId:
          type: integer
          format: int64
          description: The bit value of the trigger. Omitted when 0, the "*" fallback.
    WebhookConfigInfo:
      type: object
      description: The subscription, plus its delivery state at send time.
      properties:
        id:
          type: integer
          format: int32
          description: The subscription ID.
        name:
          type: string
          description: The subscription name given by its creator.
        url:
          type: string
          description: The URL the delivery is posted to.
        triggers:
          type: array
          items:
            type: string
          description: The subscribed events, or ["*"] for the catch-all.
        target:
          $ref: '#/components/schemas/WebhookTargetInfo'
        lastFailureOn:
          type: string
          format: date-time
          description: >-
            When the last delivery to this subscription failed, in UTC. Sent only on an automatic retry,
            together with `retryCount`; absent on a first attempt, the first attempt of a manual retry
            included.
        lastFailureContent:
          type: string
          description: >-
            What the receiver answered, or the network error, when the last delivery to this subscription
            failed. Sent only on an automatic retry, like `lastFailureOn`.
        lastSuccessOn:
          type: string
          format: date-time
          description: >-
            When the last delivery to this subscription succeeded, in UTC. Sent only on an automatic retry,
            like `lastFailureOn`; absent there too when no delivery has succeeded yet.
        retryCount:
          type: integer
          format: int32
          description: >-
            How many times this delivery has been retried automatically. Omitted on the first attempt
            (0); present from attempt 2. A manual retry is a new delivery and starts again from 0, so
            its first attempt carries no `retryCount`, `lastFailureOn` or `lastSuccessOn`; only the repeated
            `event.id` shows that the event was sent before.
        retryOn:
          type: string
          format: date-time
          description: When the next retry is scheduled, in UTC; absent when no retry is pending.
    WebhookTargetInfo:
      type: object
      description: >-
        The entity the subscription is scoped to. Present only when the subscription is scoped to one
        entity.
      properties:
        id:
          $ref: '#/components/schemas/EntryId'
        type:
          type: string
          description: >-
            The prefix of the trigger the delivery is for: user, group, file, folder, room, form or agent
            today. Deliberately not an enum: every new trigger family adds a value, and a receiver built
            against an older contract must keep parsing it.
    UserPayload:
      type: object
      description: |-
        The user carried by a user.* webhook.

        A copy of EmployeeFullDto, deliberately not derived from it: the webhook wire contract is versioned separately from the REST API and the two are free to diverge. Delivery is gated by WebhookUserAccessChecker against the subscription owner, and the fields the REST API shows by the reader's role (groups, quota, CreatedBy) are cut by the same rules for that owner (UserWebhookDtoHelper.RestrictForSubscriberAsync). Timestamps are UTC, matching the delivery envelope, rather than the tenant-local ApiDateTime the REST API uses.

        Not carried, deliberately: sid, ssoNameId and ssoSessionId (the LDAP and SAML identifiers and a SAML session ID, all of which the domain entity used to put on the wire), loginEventId, authCookieLifetime, tfaAppEnabled, theme, isAnonim and shared. `contacts` appears once, as a typed list, rather than twice in two shapes.
      properties:
        id:
          type: string
          format: uuid
          description: The user ID.
        displayName:
          type: string
          description: The HTML-encoded user display name formatted according to the portal default format.
        firstName:
          type: string
          description: The user first name.
        lastName:
          type: string
          description: The user last name.
        userName:
          type: string
          description: The user name.
        email:
          type: string
          format: email
          description: The user email address.
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactPayload'
          description: The list of user contacts.
        status:
          type: integer
          description: >-
            The user status. Flags of `EmployeeStatus`: 1 = Active, 2 = Terminated, 4 = Pending, 5 = Default,
            7 = All.
        activationStatus:
          type: integer
          description: >-
            The user activation status, with the `AutoGenerated` flag masked off. Flags of `EmployeeActivationStatus`:
            0 = NotActivated, 1 = Activated, 2 = Pending, 4 = AutoGenerated.
        terminated:
          type: string
          format: date-time
          description: The UTC date when the user was terminated.
        department:
          type: string
          description: >-
            The comma-separated names of the groups the user belongs to, as plain text rather than HTML-encoded.
            Omitted when the subscription owner is a `User` or a `Guest` and the event is about someone
            else.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupSummaryPayload'
          description: >-
            The list of groups the user belongs to. Omitted when the subscription owner is a `User` or
            a `Guest` and the event is about someone else.
        location:
          type: string
          description: The user location.
        notes:
          type: string
          description: The user notes.
        isAdmin:
          type: boolean
          description: Specifies whether the user is a DocSpace administrator or not.
        isRoomAdmin:
          type: boolean
          description: Specifies whether the user is a room administrator or not.
        isOwner:
          type: boolean
          description: Specifies whether the user is the portal owner or not.
        isVisitor:
          type: boolean
          description: Specifies whether the user is a guest or not.
        isCollaborator:
          type: boolean
          description: Specifies whether the user is a user with limited rights or not.
        isLDAP:
          type: boolean
          description: Specifies whether the user comes from LDAP or not.
        isSSO:
          type: boolean
          description: Specifies whether the user comes from SSO or not.
        listAdminModules:
          type: array
          items:
            type: string
          description: The list of the modules the user administers.
        cultureName:
          type: string
          description: The user culture code.
        mobilePhone:
          type: string
          description: The user mobile phone number.
        mobilePhoneActivationStatus:
          type: integer
          description: >-
            The mobile phone activation status. Flags of `MobilePhoneActivationStatus`: 0 = NotActivated,
            1 = Activated.
        quotaLimit:
          type: integer
          format: int64
          description: The user quota limit in bytes. Sent only to a `DocSpaceAdmin` or to the user themselves.
        usedSpace:
          type: number
          format: double
          description: >-
            The portal space used by the user in bytes. Sent only to a `DocSpaceAdmin` or to the user
            themselves.
        isCustomQuota:
          type: boolean
          description: >-
            Specifies whether the user has a custom quota or not. Sent only to a `DocSpaceAdmin` or to
            the user themselves.
        createdBy:
          $ref: '#/components/schemas/UserSummaryPayload'
        registrationDate:
          type: string
          format: date-time
          description: The UTC date when the user was registered.
        hasAvatar:
          type: boolean
          description: Specifies whether the user has an avatar or not.
        avatar:
          type: string
          description: >-
            The absolute URL of the 82x82 avatar, with a hash query parameter that changes when the profile
            does.
        avatarOriginal:
          type: string
          description: The absolute URL of the original avatar, with the same hash parameter.
        avatarMax:
          type: string
          description: The absolute URL of the 200x200 avatar, with the same hash parameter.
        avatarMedium:
          type: string
          description: The absolute URL of the 48x48 avatar, with the same hash parameter.
        avatarSmall:
          type: string
          description: The absolute URL of the 32x32 avatar, with the same hash parameter.
        profileUrl:
          type: string
          description: >-
            The absolute link to the user in the portal's list of people, or of guests for a guest; today
            it is a search of that list by the user's email address. Absent when the subscription's creator
            is a User or a Guest, who may not see the contacts of other users, unless this user is that
            creator.
    ContactPayload:
      type: object
      description: A user contact.
      properties:
        type:
          type: string
          description: The contact type.
        value:
          type: string
          description: The contact value.
    GroupSummaryPayload:
      type: object
      description: A group referenced from another webhook payload.
      properties:
        id:
          type: string
          format: uuid
          description: The group ID.
        name:
          type: string
          description: The group name.
        manager:
          type: string
          description: The user name of the group manager, not an ID.
        isSystem:
          type: boolean
          description: Specifies whether the group is a system group or not.
    UserSummaryPayload:
      type: object
      description: A user referenced from another webhook payload.
      properties:
        id:
          type: string
          format: uuid
          description: The user ID.
        displayName:
          type: string
          description: The HTML-encoded user display name.
        userName:
          type: string
          description: The user name.
        avatar:
          type: string
          description: >-
            The absolute URL of the 82x82 avatar, with a hash query parameter that changes when the profile
            does.
        profileUrl:
          type: string
          description: >-
            The absolute link to the user in the portal's list of people, or of guests for a guest; today
            it is a search of that list by the user's email address. Absent when the subscription's creator
            is a User or a Guest, who may not see the contacts of other users, unless this user is that
            creator.
    GroupPayload:
      type: object
      description: |-
        The group carried by a group.* webhook.

        A copy of GroupDto, deliberately not derived from it. The member list is not carried: a group can hold thousands of users and every one of them would be expanded into the body of every group event. Receivers that need the roster should call GET api/2.0/group/{id} with MembersCount as the hint that it changed.
      properties:
        id:
          type: string
          format: uuid
          description: The group ID.
        name:
          type: string
          description: The group name.
        parent:
          type: string
          format: uuid
          description: The parent group ID; absent for a top-level group.
        category:
          type: string
          format: uuid
          description: >-
            The ID of the group category: the empty GUID for the groups members create, and one fixed
            category ID for the built-in system groups.
        isLDAP:
          type: boolean
          description: Specifies whether the group comes from LDAP or not.
        isSystem:
          type: boolean
          description: Specifies whether the group is a system group or not.
        manager:
          $ref: '#/components/schemas/UserSummaryPayload'
        membersCount:
          type: integer
          format: int32
          description: The number of group members.
    FilePayload:
      description: |-
        The file carried by a file.* webhook, and by form.filled.out and form.stopped.

        A copy of FileDto. Not carried: thumbnailUrl, dimensions, viewAccessibility, formFillingStatus, hasDraft and the form-role fields. Each needs per-request work the REST helper does and a delivery must not; dimensions in particular opens the file stream to measure the image.
      allOf:
        - $ref: '#/components/schemas/FileEntryPayload'
        - type: object
          properties:
            version:
              type: integer
              format: int32
              description: The file version.
            versionGroup:
              type: integer
              format: int32
              description: The version group of the file.
            contentLength:
              type: integer
              format: int64
              description: The file size in bytes, as a number; the REST FileDto sends a formatted string
                instead.
            fileType:
              type: integer
              description: >-
                The file type. Values of `FileType`: 0 = Unknown, 1 = Archive, 2 = Video, 3 = Audio, 4
                = Image, 5 = Spreadsheet, 6 = Presentation, 7 = Document, 10 = Pdf, 11 = Diagram.
            fileExst:
              type: string
              description: The file extension, including the leading dot.
            comment:
              type: string
              description: The comment on the current file version.
            viewUrl:
              type: string
              description: The URL the file content can be downloaded from. Carries no share token.
            webUrl:
              type: string
              description: The URL the file can be opened at in a browser. Carries no share token.
            encrypted:
              type: boolean
              description: Specifies whether the file is encrypted or not.
            locked:
              type: boolean
              description: Specifies whether the file is locked or not.
            lockedBy:
              type: string
              description: The user name of whoever locked the file.
            isForm:
              type: boolean
              description: >-
                True for every PDF file, with or without form fields, since the editor can open any PDF
                as a form; absent for other files. It does not tell a fillable form from an ordinary PDF
                document.
            customFilterEnabled:
              type: boolean
              description: Specifies whether a custom filter is enabled for the file or not.
            customFilterEnabledBy:
              type: string
              description: The user name of whoever enabled the custom filter.
            lastOpened:
              type: string
              format: date-time
              description: The UTC date when the file was last opened.
            vectorizationStatus:
              type: integer
              description: >-
                The AI vectorization status of the file. Values of `VectorizationStatus`: 0 = InProgress,
                1 = Completed, 2 = Failed.
    FileEntryPayload:
      type: object
      description: |-
        What every file, folder and room webhook payload has in common.

        A copy of FileEntryDto, deliberately not derived from it, and populated straight from the domain entity rather than through FileEntryDtoHelper. Three groups of the REST fields are not carried:

        - caller-relative state - access, security, securityByUsers, availableShareRights, shareSettings, canShare, shared, sharedForUser, sharedExternal, parentShared, isFavorite, requestToken, external, shareRecord. A delivery has no caller; who may receive it is already decided by WebhookFileEntryAccessChecker against the subscription owner, and putting one user's permission matrix on the wire would be both meaningless and a disclosure.

        - anything the REST helper pays for per request - thumbnails, image dimensions (it opens the file stream), form-filling roles, view accessibility, external share links.

        - subtype fields belong on the subtype, unlike the previous payload where File and Folder members were erased by the declared parameter type and never reached the wire at all.

        Timestamps are UTC, matching the delivery envelope, rather than the tenant-local ApiDateTime.
      properties:
        id:
          $ref: '#/components/schemas/EntryId'
        parentId:
          $ref: '#/components/schemas/EntryId'
        rootFolderId:
          $ref: '#/components/schemas/EntryId'
        title:
          type: string
          description: The file entry title.
        fileEntryType:
          type: integer
          description: >-
            The file entry type: 1 for a folder, 2 for a file. Present on every entry payload. Flags of
            `FileEntryType`: 1 = Folder, 2 = File.
        created:
          type: string
          format: date-time
          description: The UTC date when the file entry was created.
        createdBy:
          $ref: '#/components/schemas/UserSummaryPayload'
        updated:
          type: string
          format: date-time
          description: The UTC date when the file entry was last updated.
        updatedBy:
          $ref: '#/components/schemas/UserSummaryPayload'
        rootFolderType:
          type: integer
          description: >-
            The root folder type of the file entry. Values of `FolderType`: 0 = DEFAULT, 1 = COMMON, 2
            = BUNCH, 3 = TRASH, 5 = USER, 6 = SHARE, 8 = Projects, 10 = Favorites, 11 = Recent, 12 = Templates,
            13 = Privacy, 14 = VirtualRooms, 15 = FillingFormsRoom, 16 = EditingRoom, 19 = CustomRoom,
            20 = Archive, 21 = ThirdpartyBackup, 22 = PublicRoom, 25 = ReadyFormFolder, 26 = InProcessFormFolder,
            27 = FormFillingFolderDone, 28 = FormFillingFolderInProgress, 29 = VirtualDataRoom, 30 = RoomTemplates,
            31 = AiRoom, 32 = Knowledge, 33 = ChatOutputs, 34 = AiAgents, 35 = DefaultTemplates, 36 =
            Forms, 37 = Ai.
        parentRoomType:
          type: integer
          description: >-
            The parent room type of the file entry. Values of `FolderType`: 0 = DEFAULT, 1 = COMMON, 2
            = BUNCH, 3 = TRASH, 5 = USER, 6 = SHARE, 8 = Projects, 10 = Favorites, 11 = Recent, 12 = Templates,
            13 = Privacy, 14 = VirtualRooms, 15 = FillingFormsRoom, 16 = EditingRoom, 19 = CustomRoom,
            20 = Archive, 21 = ThirdpartyBackup, 22 = PublicRoom, 25 = ReadyFormFolder, 26 = InProcessFormFolder,
            27 = FormFillingFolderDone, 28 = FormFillingFolderInProgress, 29 = VirtualDataRoom, 30 = RoomTemplates,
            31 = AiRoom, 32 = Knowledge, 33 = ChatOutputs, 34 = AiAgents, 35 = DefaultTemplates, 36 =
            Forms, 37 = Ai.
        originId:
          $ref: '#/components/schemas/EntryId'
        originRoomId:
          $ref: '#/components/schemas/EntryId'
        originTitle:
          type: string
          description: The origin title of the file entry.
        originRoomTitle:
          type: string
          description: The origin room title of the file entry.
        providerItem:
          type: boolean
          description: Specifies whether the file entry is backed by a third-party provider or not.
        providerKey:
          type: string
          description: The third-party provider key of the file entry.
        providerId:
          type: integer
          format: int32
          description: The third-party provider ID of the file entry.
        order:
          type: integer
          format: int32
          description: The position of the file entry within an indexed room.
    FolderPayload:
      description: |-
        The folder carried by a folder.* webhook.

        A copy of FolderDto reduced to what a plain folder has. Rooms are a separate payload (RoomWebhookDto) even though both come from Folder<T>, because room.* and folder.* are separate triggers whose contracts should be free to move independently. Not carried: inRoom, mute and new, all of them per-viewer state.
      allOf:
        - $ref: '#/components/schemas/FileEntryPayload'
        - type: object
          properties:
            filesCount:
              type: integer
              format: int32
              description: The number of files the folder directly contains.
            foldersCount:
              type: integer
              format: int32
              description: The number of subfolders the folder directly contains.
            type:
              type: integer
              description: >-
                The folder type. Values of `FolderType`: 0 = DEFAULT, 1 = COMMON, 2 = BUNCH, 3 = TRASH,
                5 = USER, 6 = SHARE, 8 = Projects, 10 = Favorites, 11 = Recent, 12 = Templates, 13 = Privacy,
                14 = VirtualRooms, 15 = FillingFormsRoom, 16 = EditingRoom, 19 = CustomRoom, 20 = Archive,
                21 = ThirdpartyBackup, 22 = PublicRoom, 25 = ReadyFormFolder, 26 = InProcessFormFolder,
                27 = FormFillingFolderDone, 28 = FormFillingFolderInProgress, 29 = VirtualDataRoom, 30
                = RoomTemplates, 31 = AiRoom, 32 = Knowledge, 33 = ChatOutputs, 34 = AiAgents, 35 = DefaultTemplates,
                36 = Forms, 37 = Ai.
            isShareable:
              type: boolean
              description: Specifies whether the folder can be shared or not.
    RoomPayload:
      description: |-
        The room carried by a room.* webhook, and by every agent.* webhook.

        A copy of the room-shaped half of FolderDto. Agent rooms use this payload too: an agent is an AI room and has the same shape today, so agent.* sends it as well. Not carried: logo, watermark, lifetime, tags and chatSettings. Each needs per-request URL building or an extra query that a delivery should not pay for; receivers can read them from GET api/2.0/files/rooms/{id}.
      allOf:
        - $ref: '#/components/schemas/FileEntryPayload'
        - type: object
          properties:
            roomType:
              type: integer
              description: >-
                The room type. Values of `RoomType`: 1 = FillingFormsRoom, 2 = EditingRoom, 5 = CustomRoom,
                6 = PublicRoom, 8 = VirtualDataRoom, 9 = AiRoom.
            type:
              type: integer
              description: >-
                The underlying folder type of the room. Values of `FolderType`: 0 = DEFAULT, 1 = COMMON,
                2 = BUNCH, 3 = TRASH, 5 = USER, 6 = SHARE, 8 = Projects, 10 = Favorites, 11 = Recent,
                12 = Templates, 13 = Privacy, 14 = VirtualRooms, 15 = FillingFormsRoom, 16 = EditingRoom,
                19 = CustomRoom, 20 = Archive, 21 = ThirdpartyBackup, 22 = PublicRoom, 25 = ReadyFormFolder,
                26 = InProcessFormFolder, 27 = FormFillingFolderDone, 28 = FormFillingFolderInProgress,
                29 = VirtualDataRoom, 30 = RoomTemplates, 31 = AiRoom, 32 = Knowledge, 33 = ChatOutputs,
                34 = AiAgents, 35 = DefaultTemplates, 36 = Forms, 37 = Ai.
            filesCount:
              type: integer
              format: int32
              description: The number of files the room directly contains.
            foldersCount:
              type: integer
              format: int32
              description: The number of folders the room directly contains.
            private:
              type: boolean
              description: Specifies whether the room is private or not.
            indexing:
              type: boolean
              description: Specifies whether the room is indexed or not.
            denyDownload:
              type: boolean
              description: Specifies whether downloading from the room is denied or not.
            pinned:
              type: boolean
              description: Specifies whether the room is pinned or not.
            quotaLimit:
              type: integer
              format: int64
              description: >-
                The room's own quota in bytes, -1 for an explicit "no limit". Absent when the room has
                no quota of its own, so the portal's default room quota applies, if room quotas are on.
                Unlike the REST API, which shows the effective limit only to members who may edit the
                room, the value goes to every subscriber that gets the event.
            usedSpace:
              type: integer
              format: int64
              description: The space used by the room in bytes.
            color:
              type: string
              description: The room cover colour.
            cover:
              type: string
              description: The room cover name.
    FormSubmitPayload:
      type: object
      description: |-
        The pair of files carried by a form.submit webhook.

        A copy of SubmittedFormData. The only trigger whose payload is a wrapper rather than a bare entry, and the only one whose webhook.target.id refers to a different entity - the original form - than the file that changed. form.filled.out and form.stopped do not use this shape; they carry a plain FileWebhookDto.
      properties:
        originalForm:
          $ref: '#/components/schemas/FilePayload'
        submittedForm:
          $ref: '#/components/schemas/FilePayload'

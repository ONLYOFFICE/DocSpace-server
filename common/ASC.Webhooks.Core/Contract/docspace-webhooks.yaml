  file.updated:
    post:
      operationId: fileUpdated
      summary: file.updated
      description: |
        Sent on the `file.updated` event. The body is a FileDelivery, whose `payload` is a FilePayload. Roles that may subscribe to it: `DocSpaceAdmin`, `RoomAdmin`, `User`.

        Raised by these REST API operations:

        - `POST api/2.0/docs/builder` (Run a document builder script), for each file the queued script saves: `file.created` for a new file, `file.updated` for an existing one
        - `PUT api/2.0/files/file/{fileId}` (Update a file), for a rename that takes effect, and again for a switch to `lastVersion`
        - `PUT api/2.0/files/file/{fileId}/comment` (Update a comment)
        - `PUT api/2.0/files/file/{fileId}/lock` (Lock a file)
        - `POST api/2.0/files/file/{fileId}/restoreversion` (Restore a file version)
        - `PUT api/2.0/files/file/{fileId}/saveediting` (Save edited file content)
        - `PUT api/2.0/files/fileops/deleteversion` (Delete file versions), once for every removed version
        - `PUT api/2.0/files/order` (Set order of files), for every file in the list
        - `POST api/2.0/files/owner` (Change the room or file owner), for every file whose owner changes
        - `PUT api/2.0/files/{fileId}/order` (Set file order), when the order changes

        Also raised by the editor, every time it saves a document, a force-save included; submitting a filled form raises `form.submit` instead.
      tags:

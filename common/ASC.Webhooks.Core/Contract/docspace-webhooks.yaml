          description: Acknowledges the delivery. The answer's body is kept in the delivery log, not interpreted.
        '410':
          description: Deletes the subscription at once; nothing is retried or sent to it any more.
        default:
          description: >-
            Any other status, a redirect, a timeout or a network error fails the attempt, which is retried
            on the schedule the description of this document gives.
x-docspace-trigger-payloads:
  description: >
    Machine-readable trigger -> payload schema map. Source of truth for the SDK dispatch layer. Generated
    from the trigger table in common/Tools/ASC.Webhooks.Contract.
  map:
    user.created: UserPayload
    user.invited: UserPayload
    user.updated: UserPayload
    user.deleted: UserPayload
    group.created: GroupPayload
    group.updated: GroupPayload
    group.deleted: GroupPayload
    file.created: FilePayload
    file.uploaded: FilePayload
    file.updated: FilePayload
    file.trashed: FilePayload
    file.deleted: FilePayload
    file.restored: FilePayload
    file.copied: FilePayload
    file.moved: FilePayload
    file.downloaded: FilePayload
    folder.created: FolderPayload
    folder.updated: FolderPayload
    folder.trashed: FolderPayload
    folder.deleted: FolderPayload
    folder.restored: FolderPayload
    folder.copied: FolderPayload
    folder.moved: FolderPayload
    folder.downloaded: FolderPayload
    room.created: RoomPayload
    room.updated: RoomPayload
    room.archived: RoomPayload
    room.deleted: RoomPayload
    room.restored: RoomPayload
    room.copied: RoomPayload
    form.submit: FormSubmitPayload
    form.filled.out: FilePayload
    form.stopped: FilePayload
    agent.created: RoomPayload
    agent.updated: RoomPayload
    agent.deleted: RoomPayload
    '*': null
components:
  schemas:
    EntryId:
      oneOf:
        - type: integer
        - type: string
      description: >
        Entry identifier. Generic T in the domain types: integer for entries in DocSpace's own storage,
        string for entries backed by a third-party provider. Both occur on the same portal.
    WebhookEnvelope:
      type: object
      description: >-
        The body of every delivery. `payload` is narrowed by `event.trigger` per x-docspace-trigger-payloads.
      properties:
        event:
          $ref: '#/components/schemas/WebhookEventInfo'
        payload:
          description: >-
            The user, group, file, folder, room, agent or form submission the event is about. Its schema
            follows from `event.trigger`: a user.* event carries a user, a file.* event a file, and so
            on.
        webhook:
          $ref: '#/components/schemas/WebhookConfigInfo'
    WebhookEventInfo:
      type: object
      description: The event a delivery reports.
      properties:
        id:
          type: integer
          format: int32
          description: >-
            The ID of the first delivery-log record of the event, and the idempotency key. It is stable
            across every resend of one event, the server's automatic retries and a manual retry from the
            admin UI alike: a manual retry is a delivery-log record of its own, but it still sends the
            ID of the first one. The same ID therefore always means the same logical event. It is also
            echoed in the x-docspace-event-id header.
        createOn:
          type: string
          format: date-time
          description: >-
            When the event happened, in UTC and whole seconds. It stays the same on every retry, automatic
            or manual, so it says nothing about when the request was sent: a freshness check on it would
            reject legitimate retries, and the replay defence is deduplication on `id`. Echoed in the
            unsigned x-docspace-event-timestamp header.
        createBy:
          type: string
          format: uuid
          description: >-
            The ID of the user whose action caused the event. Omitted when it is the empty GUID, as for
            background jobs.
        trigger:
          type: string
          description: The trigger name, e.g. "file.created". "*" only in the legacy-payload fallback.
        triggerId:
          type: integer
          format: int64
          description: The bit value of the trigger. Omitted when 0, the "*" fallback.
    WebhookConfigInfo:
      type: object
      description: The subscription, plus its delivery state at send time.
      properties:
        id:
          type: integer
          format: int32
          description: The subscription ID.
        name:
          type: string
          description: The subscription name given by its creator.
        url:
          type: string
          description: The URL the delivery is posted to.
        triggers:
          type: array
          items:
            type: string
          description: The subscribed events, or ["*"] for the catch-all.
        target:
          $ref: '#/components/schemas/WebhookTargetInfo'
        lastFailureOn:
          type: string
          format: date-time
          description: >-
            When the last delivery to this subscription failed, in UTC. Sent only on an automatic retry,
            together with `retryCount`; absent on a first attempt, the first attempt of a manual retry
            included.
        lastFailureContent:
          type: string
          description: >-
            What the receiver answered, or the network error, when the last delivery to this subscription
            failed. Sent only on an automatic retry, like `lastFailureOn`.
        lastSuccessOn:
          type: string
          format: date-time
          description: >-
            When the last delivery to this subscription succeeded, in UTC. Sent only on an automatic retry,
            like `lastFailureOn`; absent there too when no delivery has succeeded yet.
        retryCount:
          type: integer
          format: int32
          description: >-
            How many times this delivery has been retried automatically. Omitted on the first attempt
            (0); present from attempt 2. A manual retry is a new delivery and starts again from 0, so
            its first attempt carries no `retryCount`, `lastFailureOn` or `lastSuccessOn`; only the repeated
            `event.id` shows that the event was sent before.
        retryOn:
          type: string
          format: date-time
          description: >-
            When this retry was sent, in UTC, cut to whole seconds. Sent only on an automatic retry, like
            `lastFailureOn`.
    WebhookTargetInfo:
      type: object
      description: >-
        The entity the subscription is scoped to. Present only when the subscription is scoped to one
        entity.
      properties:
        id:
          $ref: '#/components/schemas/EntryId'
        type:
          type: string
          description: >-
            The prefix of the trigger the delivery is for: user, group, file, folder, room, form or agent
            today. Deliberately not an enum: every new trigger family adds a value, and a receiver built
            against an older contract must keep parsing it.
    UserPayload:
      type: object
      description: |-
        The user a user.* webhook is about.

        All dates are in UTC. The quota fields go only to a DocSpace admin and to the user themselves, and the author of the account only to a DocSpace admin. A subscription owner of the `User` or `Guest` type, who may not see the contacts of other users, gets someone else's profile without the groups, the department and the profile link.
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the user the event is about; `GET api/2.0/people/{userid}` returns the
            full profile by it.
        displayName:
          type: string
          description: The user's full name in the name order set for the portal, HTML-encoded.
        firstName:
          type: string
          description: The user's first name as entered in the profile.
        lastName:
          type: string
          description: The user's last name as entered in the profile.
        userName:
          type: string
          description: >-
            The unique login name of the user, made from the local part of their email address when the
            account is created. Absent when the subscription's creator is a User or a Guest, who may not
            see the contacts of other users, unless this user is that creator.
        email:
          type: string
          format: email
          description: >-
            The email address the user signs in with and receives notifications at. Absent when the subscription's
            creator is a User or a Guest, who may not see the contacts of other users, unless this user
            is that creator.
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactPayload'
          description: >-
            The additional contacts from the user's profile, such as extra phone numbers, emails and social
            links. Absent when the profile has none, and when the subscription's creator is a User or
            a Guest, who may not see the contacts of other users, unless this user is that creator.
        status:
          type: integer
          description: >-
            Whether the account is active or disabled. A disabled user cannot sign in; `terminated` says
            since when. Flags of `EmployeeStatus`: 1 = Active, 2 = Terminated, 4 = Pending, 5 = Default,
            7 = All.
        activationStatus:
          type: integer
          description: >-
            Whether the user has confirmed their email address. The `AutoGenerated` flag is never set
            here. Flags of `EmployeeActivationStatus`: 0 = NotActivated, 1 = Activated, 2 = Pending, 4
            = AutoGenerated.
        terminated:
          type: string
          format: date-time
          description: When the account was disabled, in UTC. Absent while the account is active.
        department:
          type: string
          description: >-
            The comma-separated names of the groups the user belongs to, as plain text rather than HTML-encoded;
            empty when the user is in no group. Omitted when the subscription owner is a `User` or a `Guest`
            and the event is about someone else.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupSummaryPayload'
          description: >-
            The groups the user belongs to; absent when the user is in no group. Omitted as well when
            the subscription owner is a `User` or a `Guest` and the event is about someone else.
        location:
          type: string
          description: The location the user entered in the profile; empty or absent when not filled in.
        notes:
          type: string
          description: The free-text notes on the user's profile; empty or absent when not filled in.
        isAdmin:
          type: boolean
          description: True when the user is a DocSpace admin, who manages the portal settings and every
            room.
        isRoomAdmin:
          type: boolean
          description: True when the user's type is Room admin, who may create rooms and manage the rooms
            they own.
        isOwner:
          type: boolean
          description: True for the portal owner, the single account that owns the portal.
        isVisitor:
          type: boolean
          description: >-
            True when the user's type is Guest, an external account that works only in the rooms it was
            invited to.
        isCollaborator:
          type: boolean
          description: >-
            True when the user's type is User, who works in the rooms they are invited to but cannot create
            rooms.
        isLDAP:
          type: boolean
          description: True when the account is synchronized from an LDAP directory, which then owns its
            name and email.
        isSSO:
          type: boolean
          description: True when the account came from single sign-on and signs in through the identity
            provider.
        listAdminModules:
          type: array
          items:
            type: string
          description: The IDs of the product modules the user administers. Absent when the user administers
            none.
        cultureName:
          type: string
          description: >-
            The interface language the user chose, as a culture code. Absent when the user follows the
            portal's language.
        mobilePhone:
          type: string
          description: >-
            The mobile phone number from the user's profile; absent when none is set, and when the subscription's
            creator is a User or a Guest, who may not see the contacts of other users, unless this user
            is that creator.
        mobilePhoneActivationStatus:
          type: integer
          description: >-
            Whether the mobile phone number has been confirmed, as SMS sign-in confirmation requires.
            Flags of `MobilePhoneActivationStatus`: 0 = NotActivated, 1 = Activated.
        quotaLimit:
          type: integer
          format: int64
          description: >-
            How much storage the user may use, in bytes; -1 when the limit is switched off for this user.
            Absent when user quotas are turned off on the portal or the portal keeps no storage statistics,
            and for any subscription owner other than a `DocSpaceAdmin` or the user themselves.
        usedSpace:
          type: number
          format: double
          description: >-
            How much storage the user's files take, in bytes. Absent when the portal keeps no storage
            statistics, and for any subscription owner other than a `DocSpaceAdmin` or the user themselves.
        isCustomQuota:
          type: boolean
          description: >-
            True when `quotaLimit` was set for this user individually, false when it is the portal's default
            user quota. Absent whenever `quotaLimit` is absent because quotas are off or statistics are
            not kept, and for any subscription owner other than a `DocSpaceAdmin` or the user themselves.
        createdBy:
          $ref: '#/components/schemas/UserSummaryPayload'
        registrationDate:
          type: string
          format: date-time
          description: When the account was created, in UTC.
        hasAvatar:
          type: boolean
          description: False when the user has not uploaded a photo; the avatar URLs then point to the
            default picture.
        avatar:
          type: string
          description: >-
            The absolute URL of the 82x82 avatar, with a hash query parameter that changes when the profile
            does.
        avatarOriginal:
          type: string
          description: The absolute URL of the original avatar, with the same hash parameter.
        avatarMax:
          type: string
          description: The absolute URL of the 200x200 avatar, with the same hash parameter.
        avatarMedium:
          type: string
          description: The absolute URL of the 48x48 avatar, with the same hash parameter.
        avatarSmall:
          type: string
          description: The absolute URL of the 32x32 avatar, with the same hash parameter.
        profileUrl:
          type: string
          description: >-
            The absolute link to the user in the portal's list of people, or of guests for a guest; today
            it is a search of that list by the user's email address. Absent when the subscription's creator
            is a User or a Guest, who may not see the contacts of other users, unless this user is that
            creator.
    ContactPayload:
      type: object
      description: An additional contact from a user's profile.
      properties:
        type:
          type: string
          description: The kind of contact as stored in the profile, such as `mail`, `phone` or `facebook`.
        value:
          type: string
          description: 'The contact itself: an address, a number or a profile link, as the user entered
            it.'
    GroupSummaryPayload:
      type: object
      description: A group referenced from another webhook payload.
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the group; `GET api/2.0/group/{id}` returns the group with its members
            by it.
        name:
          type: string
          description: The name of the group as it is shown in the portal.
        manager:
          type: string
          description: The user name of the user who manages the group, not an ID. Absent when the group
            has no manager.
        isSystem:
          type: boolean
          description: >-
            `true` for a built-in system group, whose members follow from the user types rather than from
            membership changes. Absent for every other group, never `false`.
    UserSummaryPayload:
      type: object
      description: >-
        A short reference to a user from another payload: the author or the last editor of a file, folder
        or room, the manager of a group, or the creator of an account.
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the referenced user; `GET api/2.0/people/{userid}` returns the full profile
            by it.
        displayName:
          type: string
          description: The user's full name in the name order set for the portal, HTML-encoded.
        userName:
          type: string
          description: >-
            The unique login name of the user, made from the local part of their email address when the
            account is created. Absent when the subscription's creator is a User or a Guest, who may not
            see the contacts of other users, unless this user is that creator.
        avatar:
          type: string
          description: >-
            The absolute URL of the 82x82 avatar, with a hash query parameter that changes when the profile
            does.
        profileUrl:
          type: string
          description: >-
            The absolute link to the user in the portal's list of people, or of guests for a guest; today
            it is a search of that list by the user's email address. Absent when the subscription's creator
            is a User or a Guest, who may not see the contacts of other users, unless this user is that
            creator.
    GroupPayload:
      type: object
      description: |-
        The group a group.* webhook is about.

        The payload describes the group at the time of the event, without the list of its members. A `group.updated` delivery follows a change made through the group API - a rename, a new manager, or members added, removed, replaced or moved to another group - but does not say which of these happened: compare the payload with the previous one, and read the current members with `GET api/2.0/group/{id}` when they are needed.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The ID of the group the event is about; `GET api/2.0/group/{id}` returns the group with its
            members by it.
        name:
          type: string
          description: The name of the group as it is shown in the portal, after a rename the new one.
        parent:
          type: string
          format: uuid
          description: The parent group ID; absent for a top-level group.
        category:
          type: string
          format: uuid
          description: >-
            The ID of the group category: the empty GUID for the groups members create, and one fixed
            category ID for the built-in system groups.
        isLDAP:
          type: boolean
          description: >-
            Whether the group is synchronized from an LDAP directory, where its name and members are managed;
            `false` for a group created in the portal.
        isSystem:
          type: boolean
          description: >-
            `true` for a built-in system group, whose members follow from the user types rather than from
            membership changes. Absent for every other group, never `false`.
        manager:
          $ref: '#/components/schemas/UserSummaryPayload'
        membersCount:
          type: integer
          format: int32
          description: >-
            How many users belong to the group at the time of the event, disabled accounts not counted;
            0 for a group without members.
    FilePayload:
      description: |-
        The file carried by a file.* webhook, and by form.filled.out and form.stopped.

        Carries no thumbnail, image dimensions or form-filling state; read them from the REST API by the file ID.
      allOf:
        - $ref: '#/components/schemas/FileEntryPayload'
        - type: object
          properties:
            version:
              type: integer
              format: int32
              description: The number of the current version of the file, starting at 1 and growing with
                every saved version.
            versionGroup:
              type: integer
              format: int32
              description: >-
                The number of the version group the current version belongs to; the versions saved during
                one editing session share a group.
            contentLength:
              type: integer
              format: int64
              description: The size of the current version of the file in bytes.
            fileType:
              type: integer
              description: >-
                The kind of content the file holds, derived from its extension: a document, a spreadsheet,
                a presentation, a PDF, an image and so on. Values of `FileType`: 0 = Unknown, 1 = Archive,
                2 = Video, 3 = Audio, 4 = Image, 5 = Spreadsheet, 6 = Presentation, 7 = Document, 10 =
                Pdf, 11 = Diagram.
            fileExst:
              type: string
              description: The file extension, including the leading dot.
            comment:
              type: string
              description: >-
                The comment saved with the current version, either typed by the user or set by the portal
                for the action that made the version.
            viewUrl:
              type: string
              description: The URL the file content can be downloaded from. Carries no share token.
            webUrl:
              type: string
              description: The URL the file can be opened at in a browser. Carries no share token.
            encrypted:
              type: boolean
              description: True when the file is end-to-end encrypted in a private room; absent otherwise.
            locked:
              type: boolean
              description: True when the file is locked, so that only the user who locked it can edit
                it; absent otherwise.
            lockedBy:
              type: string
              description: The name of the user who locked the file, when `locked` is true.
            isForm:
              type: boolean
              description: >-
                True for every PDF file, with or without form fields, since the editor can open any PDF
                as a form; absent for other files. It does not tell a fillable form from an ordinary PDF
                document.
            customFilterEnabled:
              type: boolean
              description: True when custom filtering is turned on for the spreadsheet; absent otherwise.
            customFilterEnabledBy:
              type: string
              description: The name of the user who turned the custom filter on, when `customFilterEnabled`
                is true.
            lastOpened:
              type: string
              format: date-time
              description: When the file was last opened, in UTC; absent when that is not known.
            vectorizationStatus:
              type: integer
              description: >-
                The state of the file's indexing for the AI features of the portal; absent when it does
                not apply. Values of `VectorizationStatus`: 0 = InProgress, 1 = Completed, 2 = Failed.
    FileEntryPayload:
      type: object
      description: |-
        What every file, folder and room webhook payload has in common.

        All dates are in UTC. A delivery goes only to a subscription owner who may see the entry, and it carries no per-user state: no access rights, share settings, favourite flag or thumbnail. Read those from the REST API by the entry ID when they are needed.
      properties:
        id:
          $ref: '#/components/schemas/EntryId'
        parentId:
          $ref: '#/components/schemas/EntryId'
        rootFolderId:
          $ref: '#/components/schemas/EntryId'
        title:
          type: string
          description: The name of the entry as shown in the portal; for a file it includes the extension.
        fileEntryType:
          type: integer
          description: >-
            Tells a folder or room payload (1) from a file payload (2), so a receiver can pick the schema
            to read the rest of the object with. Flags of `FileEntryType`: 1 = Folder, 2 = File.
        created:
          type: string
          format: date-time
          description: When the entry was created, in UTC.
        createdBy:
          $ref: '#/components/schemas/UserSummaryPayload'
        updated:
          type: string
          format: date-time
          description: When the entry was last changed, in UTC; equal to `created` for an entry that has
            not changed since.
        updatedBy:
          $ref: '#/components/schemas/UserSummaryPayload'
        rootFolderType:
          type: integer
          description: >-
            The kind of top-level section the entry sits in, such as My documents, Rooms, Archive or Trash.
            Values of `FolderType`: 0 = DEFAULT, 1 = COMMON, 2 = BUNCH, 3 = TRASH, 5 = USER, 6 = SHARE,
            8 = Projects, 10 = Favorites, 11 = Recent, 12 = Templates, 13 = Privacy, 14 = VirtualRooms,
            15 = FillingFormsRoom, 16 = EditingRoom, 19 = CustomRoom, 20 = Archive, 21 = ThirdpartyBackup,
            22 = PublicRoom, 25 = ReadyFormFolder, 26 = InProcessFormFolder, 27 = FormFillingFolderDone,
            28 = FormFillingFolderInProgress, 29 = VirtualDataRoom, 30 = RoomTemplates, 31 = AiRoom, 32
            = Knowledge, 33 = ChatOutputs, 34 = AiAgents, 35 = DefaultTemplates, 36 = Forms, 37 = Ai.
        parentRoomType:
          type: integer
          description: >-
            The type of the room the entry is inside, at any depth; absent for an entry outside rooms.
            Values of `FolderType`: 0 = DEFAULT, 1 = COMMON, 2 = BUNCH, 3 = TRASH, 5 = USER, 6 = SHARE,
            8 = Projects, 10 = Favorites, 11 = Recent, 12 = Templates, 13 = Privacy, 14 = VirtualRooms,
            15 = FillingFormsRoom, 16 = EditingRoom, 19 = CustomRoom, 20 = Archive, 21 = ThirdpartyBackup,
            22 = PublicRoom, 25 = ReadyFormFolder, 26 = InProcessFormFolder, 27 = FormFillingFolderDone,
            28 = FormFillingFolderInProgress, 29 = VirtualDataRoom, 30 = RoomTemplates, 31 = AiRoom, 32
            = Knowledge, 33 = ChatOutputs, 34 = AiAgents, 35 = DefaultTemplates, 36 = Forms, 37 = Ai.
        originId:
          $ref: '#/components/schemas/EntryId'
        originRoomId:
          $ref: '#/components/schemas/EntryId'
        originTitle:
          type: string
          description: For an entry in the trash, the name of the folder it was deleted from.
        originRoomTitle:
          type: string
          description: For an entry in the trash, the name of the room it was deleted from.
        providerItem:
          type: boolean
          description: True when the entry lives in a connected third-party storage; absent for the portal's
            own storage.
        providerKey:
          type: string
          description: The connected third-party storage the entry lives in; absent for the portal's own
            storage.
        providerId:
          type: integer
          format: int32
          description: >-
            The ID of the third-party storage connection the entry comes through; absent for the portal's
            own storage.
        order:
          type: integer
          format: int32
          description: The position of the entry in a room with indexing turned on; meaningful only inside
            such a room.
    FolderPayload:
      description: >-
        The folder carried by a folder.* webhook. A room is never sent in this shape: room.* webhooks
        carry their own payload.
      allOf:
        - $ref: '#/components/schemas/FileEntryPayload'
        - type: object
          properties:
            filesCount:
              type: integer
              format: int32
              description: The number of files the folder directly contains.
            foldersCount:
              type: integer
              format: int32
              description: The number of subfolders the folder directly contains.
            type:
              type: integer
              description: >-
                The kind of folder: an ordinary one, or one the portal creates and maintains itself, such
                as the folders of a form-filling room. Values of `FolderType`: 0 = DEFAULT, 1 = COMMON,
                2 = BUNCH, 3 = TRASH, 5 = USER, 6 = SHARE, 8 = Projects, 10 = Favorites, 11 = Recent,
                12 = Templates, 13 = Privacy, 14 = VirtualRooms, 15 = FillingFormsRoom, 16 = EditingRoom,
                19 = CustomRoom, 20 = Archive, 21 = ThirdpartyBackup, 22 = PublicRoom, 25 = ReadyFormFolder,
                26 = InProcessFormFolder, 27 = FormFillingFolderDone, 28 = FormFillingFolderInProgress,
                29 = VirtualDataRoom, 30 = RoomTemplates, 31 = AiRoom, 32 = Knowledge, 33 = ChatOutputs,
                34 = AiAgents, 35 = DefaultTemplates, 36 = Forms, 37 = Ai.
            isShareable:
              type: boolean
              description: True when the folder can be shared; absent otherwise.
    RoomPayload:
      description: |-
        The room carried by a room.* webhook, and the AI agent carried by every agent.* webhook.

        Carries no logo, watermark, file lifetime, tags or chat settings; read them from `GET api/2.0/files/rooms/{id}`.
      allOf:
        - $ref: '#/components/schemas/FileEntryPayload'
        - type: object
          properties:
            roomType:
              type: integer
              description: >-
                The kind of room, which decides what the room is for and which roles it offers. Values
                of `RoomType`: 1 = FillingFormsRoom, 2 = EditingRoom, 5 = CustomRoom, 6 = PublicRoom,
                8 = VirtualDataRoom, 9 = AiRoom.
            type:
              type: integer
              description: >-
                The same kind of room as `roomType`, in the numbering the portal uses for folders. Values
                of `FolderType`: 0 = DEFAULT, 1 = COMMON, 2 = BUNCH, 3 = TRASH, 5 = USER, 6 = SHARE, 8
                = Projects, 10 = Favorites, 11 = Recent, 12 = Templates, 13 = Privacy, 14 = VirtualRooms,
                15 = FillingFormsRoom, 16 = EditingRoom, 19 = CustomRoom, 20 = Archive, 21 = ThirdpartyBackup,
                22 = PublicRoom, 25 = ReadyFormFolder, 26 = InProcessFormFolder, 27 = FormFillingFolderDone,
                28 = FormFillingFolderInProgress, 29 = VirtualDataRoom, 30 = RoomTemplates, 31 = AiRoom,
                32 = Knowledge, 33 = ChatOutputs, 34 = AiAgents, 35 = DefaultTemplates, 36 = Forms, 37
                = Ai.
            filesCount:
              type: integer
              format: int32
              description: The number of files the room directly contains.
            foldersCount:
              type: integer
              format: int32
              description: The number of folders the room directly contains.
            private:
              type: boolean
              description: True for a private room, whose files are end-to-end encrypted.
            indexing:
              type: boolean
              description: >-
                True when the room numbers its files and folders in a fixed order; `order` on each entry
                is that number.
            denyDownload:
              type: boolean
              description: >-
                True when downloading, copying and printing the room's files is restricted for those who
                may only view them.
            pinned:
              type: boolean
              description: Specifies whether the room is pinned or not.
            quotaLimit:
              type: integer
              format: int64
              description: >-
                The room's own quota in bytes, -1 for an explicit "no limit". Absent when the room has
                no quota of its own, so the portal's default room quota applies, if room quotas are on,
                and absent as well when the subscription's creator may not edit the room: as in the REST
                API, only those who may edit a room see its quota.
            usedSpace:
              type: integer
              format: int64
              description: The space used by the room in bytes.
            color:
              type: string
              description: The background colour of the room icon, as a hex RGB code.
            cover:
              type: string
              description: The name of the cover picture chosen for the room icon; absent when none is
                chosen.
    FormSubmitPayload:
      type: object
      description: |-
        The pair of files carried by a form.submit webhook.

        The only payload that wraps two entries rather than being one, and the only one whose `webhook.target.id` refers to a different entity, the original form, than the file that changed. form.filled.out and form.stopped do not use this shape; they carry a single file.
      properties:
        originalForm:
          $ref: '#/components/schemas/FilePayload'
        submittedForm:
          $ref: '#/components/schemas/FilePayload'
    UserDelivery:
      description: 'A delivery whose payload is a UserPayload: WebhookEnvelope with `payload` typed.'
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelope'
        - type: object
          properties:
            payload:
              $ref: '#/components/schemas/UserPayload'
    GroupDelivery:
